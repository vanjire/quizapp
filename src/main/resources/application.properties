spring.datasource.url=jdbc:mysql://localhost:3306/quizora
spring.datasource.username=vanjire
spring.datasource.password=1234

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=${PORT:8080}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# 1. Store sessions in the database instead of RAM
spring.session.store-type=jdbc
# 2. Tell Spring to create the necessary tables automatically
spring.session.jdbc.initialize-schema=always

# 3. Keep the session alive for 30 days (default is usually only 30 mins)
server.servlet.session.timeout=30d
# 4. Tell the mobile browser to keep the cookie even if the tab is closed
server.servlet.session.cookie.max-age=30d

# 5. Security (Important for HTTPS/Live sites)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
